<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morpheus – PC Check-up</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></symbol>
  <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-6"/></symbol>
  <symbol id="i-pad" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M16 12h.01M18 14h.01"/></symbol>
  <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l2-5 4 10 2-5h6"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 13h6M9 17h6"/></symbol>
  <symbol id="i-scan" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></symbol>
  <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17h.01"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></symbol>
</svg>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="logo"><img src="/assets/morpheus-logo.png" alt="Morpheus – PC Check-up"></div>
    <nav id="nav" aria-label="Hauptnavigation"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <div class="col">
    <header class="top" id="top">
      <div class="crumb" id="crumb">Kein Bericht geladen</div>
      <label class="search"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg><input id="gsearch" type="search" placeholder="Prüfungen durchsuchen …" aria-label="Prüfungen durchsuchen" autocomplete="off"><span class="kbd" aria-hidden="true">/</span></label>
      <button type="button" class="btn" id="ki-btn" title="Kopiert die Befunde ohne PC-Namen, Benutzernamen und Adressen in die Zwischenablage"><svg class="i" aria-hidden="true"><use href="#i-copy"/></svg><span>Für KI kopieren</span></button>
      <button type="button" class="btn ghost" id="st-toggle" aria-pressed="true" title="Statusleiste ein- oder ausblenden"><svg class="i" aria-hidden="true"><use href="#i-panel"/></svg><span>Statusleiste</span></button>
      <a class="btn primary" href="#/scan"><svg class="i" aria-hidden="true"><use href="#i-scan"/></svg><span>Neuer Scan</span></a>
    </header>
    <main id="view" tabindex="-1"><div class="loading">Lädt …</div></main>
  </div>
  <aside class="status" id="status" aria-label="Statusleiste">
    <div id="st-live"></div>
    <div id="st-report"></div>
  </aside>
</div>
<div class="modal" id="modal" aria-hidden="true"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title" id="dlg">
  <h3 id="dlg-title"></h3>
  <div id="dlg-body"></div>
  <div class="right" id="dlg-buttons"></div>
</div></div>
<div id="fatal" class="fatal hide" role="alert"></div>
<noscript>Morpheus braucht JavaScript.</noscript>
<script src="app.js"></script>
</body>
</html>
